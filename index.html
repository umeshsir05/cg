<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>छत्तीसगढ़ सामान्य ज्ञान (CG GK)</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header Navigation -->
    <header class="navbar">
        <div class="nav-left">
            <button class="hamburger-btn" id="menuToggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <h1 class="logo-text">छत्तीसगढ़ <span>GK</span></h1>
        </div>
        <div class="nav-right">
            <button class="theme-btn" id="themeToggle" aria-label="Toggle Dark Mode">
                <span class="theme-icon">🌙</span>
            </button>
        </div>
    </header>

    <!-- Sidebar Overlay & Drawer -->
    <div class="overlay" id="overlay"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h2>अध्याय सूची (20)</h2>
            <button class="close-btn" id="closeSidebar">&times;</button>
        </div>
        <nav class="chapter-list" id="chapterNav">
            <!-- Dynamic Chapter Buttons -->
        </nav>
    </aside>

    <!-- Main Content Workspace -->
    <main class="content-container">
        <!-- Current Chapter Info -->
        <div class="chapter-banner">
            <h2 id="currentChapterTitle">1. छत्तीसगढ़ का भौगोलिक परिचय</h2>
            <span class="quiz-status" id="quizStatus">0 प्रश्न उपलब्ध</span>
        </div>

        <!-- Jump to Question Toolbar -->
        <div class="quiz-toolbar">
            <div class="jump-box">
                <label for="jumpInput">प्रश्न क्रमांक:</label>
                <input type="number" id="jumpInput" min="1" placeholder="उदा. 51">
                <button class="action-btn-sm" id="jumpBtn">Go</button>
            </div>
            <div class="auto-save-tag">
                <span>💾 प्रगति ऑटो-सेव चालू है</span>
            </div>
        </div>

        <!-- Question Card -->
        <section class="quiz-card" id="quizContainer">
            <div id="questionArea">
                <!-- MCQ items injected by script.js -->
            </div>
            
            <div class="nav-actions">
                <button class="action-btn" id="prevBtn" disabled>पिछला</button>
                <button class="action-btn" id="nextBtn">अगला</button>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
